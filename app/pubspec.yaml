name: my_hostel
description: My Hostel – owner app (Android) and student web pages.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any
  supabase_flutter: ^2.8.0
  go_router: ^14.6.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  geocoding: ^4.0.0
  qr_flutter: ^4.1.0
  gal: ^2.3.0 # save the join QR code to the phone's gallery
  google_fonts: ^6.2.1
  # Reports: Excel / PDF downloads and sharing
  excel: ^4.0.6
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  open_filex: ^4.6.0 # open a downloaded report on the phone
  # Student app: open on the hostel / bed after installing from the "Get the app" page
  play_install_referrer: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
